[package]
name = "llm_from_scratch"
version = "0.1.0"
edition = "2024"

[features]
# 默认不启用 GPU，保持构建轻量；cargo run --features gpu 时开启 wgpu 加速
default = []
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
# 仅用工具库做配置/命令行/序列化；深度学习算法全部为纯手写实现
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# 数据并行：把训练热路径里的逐元素/逐行 CPU 算子分摊到多核，避免 CPU 单线程成为瓶颈
rayon = "1"
# 可选：GPU 加速（wgpu 计算着色器，支持 NVIDIA / Intel 核显，Windows 走 DX12/Vulkan）
wgpu = { version = "30", optional = true }
# wgpu 的异步初始化需要事件循环，pollster 提供最简单的同步阻塞工具（零依赖）
pollster = { version = "0.4", optional = true }

[target.'cfg(windows)'.dependencies]
# 仅用于把 Windows 控制台切到 UTF-8（避免中文输出乱码），
# 以及用 GetLocalTime 取本地时间作为运行日志的时间戳（Windows 文件名不允许 ':')
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
] }

[profile.release]
# 训练热路径全在数学算子里，跨 crate 内联（LTO）+ 单 codegen 单元能再挤出几个百分点。
# 代价是 release 构建变慢（wgpu 依赖树较大），训练本身不受影响。
lto = "thin"
codegen-units = 1