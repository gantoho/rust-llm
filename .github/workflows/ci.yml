name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Windows 上 MSVC 链接更稳，且项目 .cargo/config.toml 就是按 MSVC 配的
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=0

jobs:
  test:
    name: build & test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 默认配置：421+ 单元测试 + 集成测试
      # （`--release` 是刻意的：本项目的测试包含大量数值对拍与性能探针，debug 下慢到不可用）
      - name: test (default)
        run: cargo test --release --all-targets

      # 快速数学路径：FMA + 打包 dW 内核走的是另一条浮点路径，必须单独跑一次
      - name: test (LLM_CPU_FMA=1)
        run: cargo test --release --all-targets
        env:
          LLM_CPU_FMA: "1"

      # GPU 后端只保证能编译（CI 机器没有 GPU，真机验证在本地做）
      # 图像 IO（VLM / 生成图片）走可选依赖，必须验证这条特性路径仍能编译+测试
      - name: test (vision-io feature)
        run: cargo test --release --all-targets --features vision-io

      - name: check (gpu feature)
        run: cargo check --all-targets --features gpu

      # CI 机器没有 GPU，跑不了 gpu 测试；但**编译**它们能立刻发现 API/签名漂移
      - name: build tests (gpu feature, no run)
        run: cargo test --release --all-targets --features gpu --no-run

  # fmt 与 clippy 都是硬门禁：`cargo fmt --check` 0 diff、`clippy -D warnings` 0 告警。
  # 有意保留的 lint 在 `src/lib.rs` 顶部以具名 `#![allow(...)]` 登记（每条都写了理由），
  # 并且 gpu / vision-io 两条特性路径也要各自过一遍同一道门禁。
  lint:
    name: fmt & clippy (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # 文档链接也是门禁：私有项/未解析链接在 `-D warnings` 下是硬错误
      - name: cargo doc (-D warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: cargo clippy (default, -D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (gpu, -D warnings)
        run: cargo clippy --all-targets --features gpu -- -D warnings

      - name: cargo clippy (vision-io, -D warnings)
        run: cargo clippy --all-targets --features vision-io -- -D warnings
